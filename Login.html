<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body { background:#f4f4f4; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
        .container { width:90%; max-width:400px; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); }
        h2 { text-align:center; margin-bottom:10px; }
        .subtitle { text-align:center; color:gray; margin-bottom:20px; }
        label { display:block; margin-top:15px; font-weight:bold; }
        input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
        button { width:100%; margin-top:20px; padding:12px; background:#007BFF; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
        button:hover { background:#0056b3; }
        .links { text-align:center; margin-top:20px; }
        .links a { color:#007BFF; text-decoration:none; display:block; margin-top:8px; }
        .error { color:red; text-align:center; margin-top:10px; font-size:14px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Welcome Back</h2>
        <p class="subtitle">Login to your To‑Do List</p>

        <!-- Show error message from server if login fails -->
        <!-- <p class="error">Invalid email or password</p> -->

        <form action="/login" method="POST" id="loginForm">
            <label for="email">Email Address</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required>

            <button type="submit">Login</button>
        </form>

        <div class="links">
            <a href="/forgot-password">Forgot Password?</a>
            <p>Don't have an account? <a href="Register.html">Register here</a></p>
        </div>
    </div>
</body>
</html>

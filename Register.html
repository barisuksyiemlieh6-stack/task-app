<!DOCTYPE html>
<html>
<head>
    <title>Register</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body { background:#f4f4f4; display:flex; justify-content:center; align-items:center; height:100vh; }
        .container { width:400px; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); }
        h2 { text-align:center; margin-bottom:10px; }
        .subtitle { text-align:center; color:gray; margin-bottom:20px; }
        label { display:block; margin-top:15px; font-weight:bold; }
        input { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
        button { width:100%; margin-top:20px; padding:12px; background:#007BFF; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
        button:hover { background:#0056b3; }
        .links { text-align:center; margin-top:20px; }
        .links a { color:#007BFF; text-decoration:none; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Create Account</h2>
        <p class="subtitle">Join the To‑Do List app</p>
        <form action="/register" method="POST">
            <label>Full Name</label>
            <input type="text" name="fullname" placeholder="Enter your full name" required>
            <label>Email Address</label>
            <input type="email" name="email" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter your password" required>
            <label>Confirm Password</label>
            <input type="password" name="confirm_password" placeholder="Confirm your password" required>
            <button type="submit">Register</button>
        </form>
        <div class="links">
            <p>Already have an account? <a href="Login.html">Login here</a></p>
        </div>
    </div>
</body>
</html>

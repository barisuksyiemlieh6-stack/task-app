<!DOCTYPE html>
<html>
<head>
    <title>Edit Task</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        body { background:#f4f4f4; }
        header { background:#007BFF; color:white; padding:20px; }
        nav a { color:white; text-decoration:none; margin-right:15px; font-weight:bold; }
        .container { width:450px; margin:40px auto; background:white; padding:30px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,0.2); }
        h2 { text-align:center; margin-bottom:20px; }
        label { display:block; margin-top:15px; font-weight:bold; }
        input, textarea, select { width:100%; padding:10px; margin-top:5px; border:1px solid #ccc; border-radius:5px; }
        textarea { resize:vertical; }
        button { width:100%; margin-top:25px; padding:12px; background:#007BFF; color:white; border:none; border-radius:5px; font-size:16px; cursor:pointer; }
        button:hover { background:#0056b3; }
        .back { text-align:center; margin-top:20px; }
        .back a { color:#007BFF; text-decoration:none; }
    </style>
</head>
<body>
    <header>
        <h1>📝 To‑Do List</h1>
        <nav>
            <a href="Dashboard.html">Dashboard</a>
            <a href="Logout">Logout</a>
        </nav>
    </header>
    <div class="container">
        <h2>Edit Task</h2>
        <form action="/edit_todo/{{ todo[0] }}" method="POST">
            <label>Title</label>
            <input type="text" name="title" value="{{ todo[1] }}" required>
            <label>Description</label>
            <textarea name="description" rows="3">{{ todo[2] if todo[2] else '' }}</textarea>
            <label>Status</label>
            <select name="status">
                <option value="Pending" {% if todo[3] == 'Pending' %}selected{% endif %}>Pending</option>
                <option value="Complete" {% if todo[3] == 'Complete' %}selected{% endif %}>Complete</option>
            </select>
            <label>Due Date</label>
            <input type="date" name="due_date" value="{{ todo[4] if todo[4] else '' }}">
            <button type="submit">Update Task</button>
        </form>
        <div class="back"><a href="Dashboard.html">← Back to Dashboard</a></div>
    </div>
</body>
</html>
